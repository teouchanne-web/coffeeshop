<!DOCTYPE html>
<html lang="en">
<head>  
    
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Tbilisi Brew</title>
  <link rel="stylesheet" href="style.css"> 
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

  <nav>
    <div class="logo">☕ Tbilisi Brew</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#menu">Menu</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section id="contact">
    <h2>Get In Touch</h2>

    <div class="contact-wrapper">

      <div class="contact-info">
        <p>📍 Rustaveli Avenue 10, Tbilisi</p>
        <p>📞 +995 555555555</p>
        <p>✉️ hello@tbilisibrew</p>
        <p>🕐 Mon–Sun: 8:00 – 22:00</p>
      </div>

      <form class="contact-form">
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea placeholder="Your Message" rows="5"></textarea>
        <button type="submit" class="btn">Send Message</button>
      </form>

      <div class="contact-map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2978.3!2d44.7833!3d41.6934!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zRustaveli+Avenue!5e0!3m2!1sen!2sge!4v1"
          width="100%"
          height="300"
          style="border:0;"
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 Tbilisi Brew. All rights reserved.</p>
  </footer>
<script src="script.js"></script>
</body>
</html>
